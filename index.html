    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Early protection against cross-origin third-party script errors (e.g. Disqus embeds, extensions, ad blockers)
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var strMsg = String(msg || '');
        if (strMsg.indexOf('Script error.') > -1 || !url || (url && url.indexOf(window.location.origin) === -1)) {
          return true; // Suppress standard browser error handling for cross-origin third party scripts
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function (e) {
        var reason = String(e.reason || '');
        if (reason.indexOf('disqus') > -1 || reason.indexOf('Script error') > -1) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#f9f9fc] text-[#1a1c1e] antialiased selection:bg-[#f9d8ff] selection:text-[#83439c]">

  </body>
